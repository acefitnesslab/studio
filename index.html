<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>運動工作室會員簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
html{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}

/* Layout: a left rail (brand + five sections) beside one working column; on phones the rail becomes a bottom tab bar. The 扣課 screen is a big-target, four-step punch flow with a sticky confirm bar; counts read like a scoreboard. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#E8ECEA; --line:#D4DBD8; --line-2:#E3E8E6;
  --ink:#16201C; --ink-2:#4F5D57; --ink-3:#7F8C86;
  --accent:#1D55D0; --accent-ink:#FFFFFF; --accent-soft:#E2EAFB;
  --ok:#1C7F4E; --ok-soft:#DFF1E7; --warn:#A35F00; --warn-soft:#FAEED8; --bad:#BC3128; --bad-soft:#FAE3E1; --mute-soft:#E8ECEA;
  --hw:#6A3FB5; --hw-soft:#EFE8FA;
  --scrim:rgba(14,22,19,.5);
  --font-display:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171E1B; --surface-2:#1F2825; --line:#2C3833; --line-2:#24302B;
  --ink:#E6ECE9; --ink-2:#A2AFA9; --ink-3:#72807A;
  --accent:#7FA3FF; --accent-ink:#0A1431; --accent-soft:#1B2644;
  --ok:#55C98F; --ok-soft:#14301F; --warn:#EFAE4B; --warn-soft:#33260E; --bad:#F27C72; --bad-soft:#3A1916; --mute-soft:#232D29;
  --hw:#C3A6F5; --hw-soft:#2A2140;
  --scrim:rgba(0,0,0,.65); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171E1B; --surface-2:#1F2825; --line:#2C3833; --line-2:#24302B;
  --ink:#E6ECE9; --ink-2:#A2AFA9; --ink-3:#72807A;
  --accent:#7FA3FF; --accent-ink:#0A1431; --accent-soft:#1B2644;
  --ok:#55C98F; --ok-soft:#14301F; --warn:#EFAE4B; --warn-soft:#33260E; --bad:#F27C72; --bad-soft:#3A1916; --mute-soft:#232D29;
  --hw:#C3A6F5; --hw-soft:#2A2140;
  --scrim:rgba(0,0,0,.65); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
.muted{color:var(--ink-3)} .small{font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:20px;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;
  background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-size:19px;letter-spacing:.04em}
.brand small{font-family:var(--font-display);font-size:12px;letter-spacing:.22em;color:var(--ink-3);text-transform:uppercase}
.nav-list{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--ink-2);text-align:left;font-weight:500;font-size:15px}
.nav-item svg{width:20px;height:20px;flex:none}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 8px}

main{min-width:0;padding-block:28px 72px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:20;flex-direction:row;gap:0;
    padding-block:4px calc(4px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
    border-right:0;border-top:1px solid var(--line)}
  .brand,.nav-foot{display:none}
  .nav-list{flex-direction:row;flex:1;gap:0}
  .nav-item{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;flex:1;align-items:center;text-align:center}
  .nav-item[aria-current="page"]{background:none}
  main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* ---------- common ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.page-head h1{font-size:26px;letter-spacing:.02em}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--ink-3);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:12px 20px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:500;text-align:left}
.link:hover{text-decoration:underline}
.icon-btn{border:0;background:none;width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--ink-2);font-size:22px;line-height:1;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface-2)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-head h2{font-size:16px}
.count{font-family:var(--font-display);color:var(--ink-3);font-size:15px;margin-left:6px;font-weight:500}

.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;line-height:20px}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.mute{background:var(--mute-soft);color:var(--ink-2)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.sample{background:none;border:1px dashed var(--ink-3);color:var(--ink-3)}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 14px;border-radius:var(--r);border:1px dashed var(--ink-3);color:var(--ink-2);font-size:14px}
.banner.bad{border-color:var(--bad);color:var(--bad);border-style:solid;background:var(--bad-soft)}
.empty{padding:28px 12px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:10px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-sm);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:5px;cursor:pointer;color:var(--ink-2);font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 12px;color:var(--ink-3)}
.search input{border:0;background:none;padding:9px 0;width:100%;outline:none;color:var(--ink)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.skeleton{height:14px;border-radius:6px;background:var(--surface-2)}

/* ---------- 扣課 punch flow ---------- */
.punch{display:flex;flex-direction:column;gap:22px;max-width:920px;width:100%}
.step{display:flex;flex-direction:column;gap:12px}
.step-h{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700}
.step-n{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--font-display);font-size:18px;flex:none}
.step.ok .step-n{background:var(--accent);color:var(--accent-ink)}
.step-h .sub{font-size:14px;font-weight:400;color:var(--ink-3)}
.big-search{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:0 16px;color:var(--ink-3)}
.big-search:focus-within{border-color:var(--accent)}
.big-search input{border:0;background:none;outline:none;width:100%;padding:16px 0;font-size:20px;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:86px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .nm{display:flex;flex-direction:column;min-width:0}
.tile .nm b{font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .nm small{font-size:13px;color:var(--ink-3)}
.tile .rm{display:flex;flex-direction:column;align-items:flex-end;line-height:1;flex:none}
.tile .rm b{font-family:var(--font-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .rm small{font-size:11px;color:var(--ink-3);margin-top:2px}
.tile.zero{opacity:.55}
.tile.low .rm b{color:var(--warn)}
.picked{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--surface);border:2px solid var(--accent)}
.picked .nm b{font-size:24px;font-weight:700}
.picked .nm small{display:block;color:var(--ink-3);font-size:14px}
.picked .hl{color:var(--bad);font-size:14px;margin-top:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:92px;padding:14px 18px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.opt:hover{border-color:var(--ink-3)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .nm{min-width:0;display:flex;flex-direction:column;gap:2px}
.opt .nm b{font-size:18px;font-weight:700}
.opt .nm small{font-size:13px;color:var(--ink-2)}
.opt .rm{text-align:right;line-height:1;flex:none}
.opt .rm b{font-family:var(--font-display);font-size:38px;font-weight:700;font-variant-numeric:tabular-nums}
.opt .rm small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{min-height:58px;min-width:110px;padding:0 24px;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-size:19px;font-weight:600;cursor:pointer}
.pill:hover{border-color:var(--ink-3)}
.pill[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.row34{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:22px 28px;align-items:start}
@media (max-width:900px){.row34{grid-template-columns:minmax(0,1fr)}}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:440px}
.cnt{height:76px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-family:var(--font-display);font-size:38px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.cnt:hover:not(:disabled){border-color:var(--ink-3)}
.cnt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.cnt:disabled{opacity:.35;cursor:not-allowed}
.confirm-bar{position:sticky;bottom:16px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 10px 30px rgba(10,20,40,.14);display:flex;flex-direction:column;gap:10px}
@media (max-width:760px){.confirm-bar{bottom:calc(74px + env(safe-area-inset-bottom,0px))}}
.confirm-sum{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;font-size:15px;color:var(--ink-2)}
.confirm-sum b{color:var(--ink)}
.confirm-sum label{display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.confirm-sum input{width:auto;padding:5px 8px;font-size:14px}
.go-btn{min-height:68px;width:100%;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:22px;font-weight:700;letter-spacing:.06em;cursor:pointer}
.go-btn:hover:not(:disabled){filter:brightness(1.07)}
.go-btn:disabled{background:var(--surface-2);color:var(--ink-3);cursor:not-allowed}
.nopkg{padding:18px;border-radius:12px;border:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;font-size:16px}
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:36px 20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:620px;width:100%}
.check{width:76px;height:76px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.success h2{font-size:30px}
.success .who{font-size:18px;color:var(--ink-2)}
.success .left{display:flex;align-items:baseline;gap:8px}
.success .left b{font-family:var(--font-display);font-size:64px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.success .actions{justify-content:center}
@media (prefers-reduced-motion:no-preference){.check{animation:pop .28s ease-out}@keyframes pop{from{transform:scale(.6)}to{transform:none}}}

/* ---------- lists ---------- */
.mlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 16px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.mrow+.mrow{border-top:1px solid var(--line-2)}
.mrow:hover{background:var(--surface-2)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:16px;flex:none}
.avatar.lg{width:56px;height:56px;font-size:22px}
.mname{min-width:0;display:flex;flex-direction:column}
.mname b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mname small{color:var(--ink-3);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.remain{display:flex;flex-direction:column;align-items:flex-end;line-height:1;min-width:52px}
.remain b{font-family:var(--font-display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.remain small{font-size:11px;color:var(--ink-3);margin-top:3px}
.remain.zero b{color:var(--ink-3)} .remain.low b{color:var(--warn)}
@media (max-width:560px){.mrow{grid-template-columns:40px minmax(0,1fr) auto}.mrow .mtags{display:none}}

.log{display:flex;flex-direction:column}
.log-row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:14px;padding:14px 0;align-items:start}
.log-row+.log-row{border-top:1px solid var(--line-2)}
.when{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.when b{font-family:var(--font-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.when small{font-size:12px;color:var(--ink-3)}
.log-main{min-width:0;display:flex;flex-direction:column;gap:6px}
.log-title{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.log-title b{font-weight:600}
.log-meta{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
.log-content{font-size:14px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.hw{border-radius:var(--r-sm);background:var(--hw-soft);padding:8px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.hw::before{content:"回家功課";display:block;font-size:12px;font-weight:700;color:var(--hw);letter-spacing:.08em;margin-bottom:2px}
.log-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.deduct{font-family:var(--font-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.row-actions{display:flex;gap:2px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumb-btn{width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);padding:0;cursor:pointer;display:grid;place-items:center;font-size:11px;color:var(--ink-2);font-weight:600}
.thumb-btn img{width:100%;height:100%;object-fit:cover;display:block}
.blk{display:flex;flex-direction:column;gap:1px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.blk-l{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-3);white-space:normal}
.cmp{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.cmp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cmp-grid>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.cmp-grid small{font-size:12px;font-weight:600;color:var(--ink-2)}
.qa{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.qa li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 0}
.qa li+li{border-top:1px solid var(--line-2)}
.qn{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;line-height:1.3}
.qa b{font-weight:600;font-size:14px;color:var(--ink-2)}
.qa p{font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.qedit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.qrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center}
.qrow .icon-btn:disabled{opacity:.3;cursor:default}
.fset{grid-column:1/-1;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.fset-t{font-size:14px}
.cmp-up{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:520px){.cmp-up{grid-template-columns:minmax(0,1fr)}}

/* member detail */
.mhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.mhead h1{font-size:26px}
.mhead .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--ink-2);margin-top:4px}
.scoreboard{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 18px;border-radius:var(--r);background:var(--ink);color:var(--bg);min-width:96px}
.scoreboard b{font-family:var(--font-display);font-size:44px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.scoreboard small{font-size:11px;letter-spacing:.14em;opacity:.75}
